# Deploy Vite/React SPA to Hostinger VPS (QA).
#
# GitHub repository secrets (same VPS as API or adjust):
#   VPS_HOST
#   VPS_USER
#   VPS_SSH_PRIVATE_KEY
#   VPS_QA_WEB_PATH  — absolute path for static files, e.g. /var/www/sethuwa-phama-qa/html/
#
# API is expected at the same origin under /api (nginx reverse proxy).

name: Deploy QA (Web)

on:
  push:
    branches: [qa, develop]
  workflow_dispatch:

concurrency:
  group: deploy-qa-web
  cancel-in-progress: true

env:
  VITE_API_BASE_URL: https://sethuwa-phama.ocevialab.com/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync dist
        env:
          REMOTE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_QA_WEB_PATH }}
        run: |
          rsync -avz --delete ./dist/ "$REMOTE"
